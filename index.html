<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>쿠팡 · 네이버 광고 리포트</title>
<link rel="stylesheet" href="assets/style.css?v=5" />
</head>
<body>
<div class="page">

  <div class="topbar">
    <div>
      <h1>쿠팡 · 네이버 광고 리포트</h1>
      <div class="subtitle">data/coupang, data/naver 폴더에 올라온 raw csv/xlsx를 자동으로 읽어서 보여줍니다.</div>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">화면 모드 전환</button>
  </div>

  <div class="platform-tabs" id="platformTabs">
    <button class="tab-btn active" data-platform="coupang" type="button">쿠팡</button>
    <button class="tab-btn" data-platform="naver" type="button">네이버</button>
  </div>

  <div class="card">
    <h2>업로드된 파일</h2>
    <div id="fileNoticeArea" class="file-list">
      <div class="empty-state">불러오는 중...</div>
    </div>
  </div>

  <div class="toolbar-actions" style="margin: 0 0 20px;">
    <button class="primary" id="downloadScreenXlsxBtn" type="button">이 화면을 엑셀 파일로 다운받기</button>
  </div>

  <div class="card" id="table1Card">
    <div class="toolbar">
      <h2 style="margin:0;">표1. 전체기간의 지표</h2>
    </div>
    <div class="table-scroll">
      <table>
        <thead id="table1Head"></thead>
        <tbody id="table1Body"></tbody>
      </table>
    </div>
    <div class="pagination">
      <span id="table1PageInfo"></span>
      <button id="table1PrevBtn" type="button">이전</button>
      <button id="table1NextBtn" type="button">다음</button>
    </div>
  </div>

  <div class="card" id="table2Card">
    <h2>표2. 광고상품별 지표 (전체기간)</h2>
    <div class="table-scroll">
      <table>
        <thead id="table2Head"></thead>
        <tbody id="table2Body"></tbody>
      </table>
    </div>
  </div>

  <div class="card" id="table3Card">
    <h2>표3. 주차별, 광고상품별 지표</h2>
    <div class="table-scroll">
      <table>
        <thead id="table3Head"></thead>
        <tbody id="table3Body"></tbody>
      </table>
    </div>
  </div>

  <div class="card" id="table4Card">
    <h2>표4. 우수 판매 TOP10 상품</h2>
    <div class="table-scroll">
      <table>
        <thead id="table4Head"></thead>
        <tbody id="table4Body"></tbody>
      </table>
    </div>
  </div>

  <div class="card" id="rawDownloadCard">
    <h2>원본 다운로드</h2>
    <div id="rawDownloadArea" class="file-list"></div>
  </div>

  <footer>표1~4는 raw 데이터를 자동으로 합산해서 계산한 값입니다. 원본 그대로는 위 "원본 다운로드"에서 받을 수 있습니다.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- app.js를 바꿀 때마다 아래 v= 숫자를 올려서, 예전 파일이 브라우저에 캐시되어 남아있는 문제를 방지합니다. -->
<script src="assets/app.js?v=7"></script>
</body>
</html>

name: Update data manifest

# data/coupang, data/naver 에 csv/xlsx/xlsb 파일이, INDEX/ 에 품목 분류 파일이,
# 또는 리포트양식/ 에 양식 파일이 새로 올라오면 scripts/build_dashboard_cache.py
# (쿠팡 키워드 리포트를 대시보드용으로 미리 합친 data/cache/)와
# scripts/build_manifest.py 를 실행해서 data/manifest.json 을 자동으로 갱신하고,
# 바뀐 내용이 있으면 자동으로 커밋/푸시한다.
# 리포트 웹페이지(index.html)는 이 manifest.json 을 읽어서 어떤 파일이 있는지 안다.

on:
  push:
    branches: [main]
    paths:
      - "data/coupang/**.csv"
      - "data/coupang/**.xlsx"
      - "data/coupang/**.xls"
      - "data/coupang/**.xlsb"
      - "data/naver/**.csv"
      - "data/naver/**.xlsx"
      - "data/naver/**.xls"
      - "data/naver/**.xlsb"
      - "scripts/build_dashboard_cache.py"
      - "scripts/build_manifest.py"
      - "INDEX/**.xlsb"
      - "INDEX/**.xlsx"
      - "INDEX/**.xls"
      - "리포트양식/**.xlsb"
      - "리포트양식/**.xlsx"
      - "리포트양식/**.xls"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      # 파일을 연달아 올리거나 지우면 실행이 줄 서서 돈다. 각 실행이 자기를
      # 시작시킨 옛 커밋이 아니라 "지금의 main"을 기준으로 만들도록 main을 받는다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # 쿠팡 키워드 리포트(수십만 행)를 키워드만 합친 가벼운 JSON으로 미리
      # 만들어둔다. 대시보드는 브라우저에서 원본을 해석하는 대신 이걸 읽는다
      # (원본 해석은 메모리가 많이 들어서 모바일에서 무한로딩이 됐음).
      - name: Build dashboard cache
        run: python3 scripts/build_dashboard_cache.py

      - name: Build manifest
        run: python3 scripts/build_manifest.py

      # 만드는 사이에 다른 업로드/삭제가 main에 먼저 들어가면 push가 거절된다.
      # 그때는 최신 main으로 다시 만들어서 최대 3번까지 다시 올린다.
      - name: Commit manifest/cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add -A data/manifest.json data/cache
            if git diff --cached --quiet; then
              echo "manifest.json / 캐시 변경 없음"
              exit 0
            fi
            git commit -m "chore: update data manifest"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 실패(main이 그새 바뀜) - 최신 main으로 다시 만들어서 재시도 ($attempt/3)"
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_dashboard_cache.py
            python3 scripts/build_manifest.py
          done
          echo "3번 모두 실패했습니다. Actions에서 다시 실행해 주세요."
          exit 1
